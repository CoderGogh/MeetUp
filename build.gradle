plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.11'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.meetup'
version = '0.1.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}
dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    runtimeOnly 'org.postgresql:postgresql'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
    useJUnitPlatform()
}

// 웹 클라이언트 스크립트 테스트 (Node 22+)
def jsTest = tasks.register('jsTest', Exec) {
    group = 'verification'
    inputs.dir 'src/main/resources/static/js'
    inputs.dir 'src/test/js'
    def ok = layout.buildDirectory.file('js-test/ok')
    outputs.file ok
    commandLine 'node', '--test', 'src/test/js/*.test.mjs'
    doLast {
        ok.get().asFile.text = 'ok'
    }
}

tasks.named('check') {
    dependsOn jsTest
}

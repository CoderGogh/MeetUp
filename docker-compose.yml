name: meetup

services:
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: ${DB_NAME:-meetup}
      POSTGRES_USER: ${DB_USER:-meetup}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-meetup-local}
    ports: ["${DB_PORT:-5432}:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["${REDIS_PORT:-6379}:6379"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
  app:
    build: .
    image: meetup-app
    env_file:
      - path: .env
        required: false
    environment: &app-env
      DB_HOST: postgis
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-meetup}
      DB_USER: ${DB_USER:-meetup}
      DB_PASSWORD: ${DB_PASSWORD:-meetup-local}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports: ["${APP_PORT:-8080}:8080"]
    depends_on:
      postgis: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped
  app2:
    image: meetup-app
    profiles: ["scale"]
    env_file:
      - path: .env
        required: false
    environment: *app-env
    ports: ["${APP2_PORT:-8081}:8080"]
    depends_on:
      app: { condition: service_healthy }
    restart: unless-stopped

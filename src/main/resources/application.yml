spring:
  application:
    name: meetup
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:meetup}
    username: ${DB_USER:meetup}
    password: ${DB_PASSWORD:}
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
meetup:
  room:
    ttl: ${ROOM_TTL:PT6H}
    confirmed-ttl: ${ROOM_CONFIRMED_TTL:PT24H}
    max-participants: 10
    expired-grace: PT1H
    invite-base-url: ${INVITE_BASE_URL:http://localhost:8080}
  realtime:
    emitter-timeout: PT30M
    heartbeat: PT20S
    retained-events: 200
    broadcast: ${REALTIME_BROADCAST:local}
